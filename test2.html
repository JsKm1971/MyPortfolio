<!-- =========================================================
     WEEK 1 — FOUNDATIONS OF PROJECT QUALITY
     Responsive HTML / CSS / JavaScript Banner
     ========================================================= -->

<style>
    /* ==============================
       BANNER CONTAINER
       ============================== */

    .quality-banner {
        width: 100%;
        max-width: 1400px;
        margin: 25px auto;
        display: flex;
        align-items: stretch;
        overflow: hidden;

        background: #ffffff;
        border-radius: 18px;

        box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.12);

        border-left: 7px solid #D6A800;

        min-height: 260px;

        font-family: "Open Sans", Arial, sans-serif;
    }


    /* ==============================
       IMAGE SECTION
       ============================== */

    .quality-banner-image {
        flex: 0 0 42%;
        position: relative;
        overflow: hidden;
        background: #003366;
    }

    .quality-banner-image img {
        width: 100%;
        height: 100%;
        min-height: 260px;

        display: block;

        object-fit: cover;
        object-position: center;

        transition: transform 0.6s ease;
    }

    /* Subtle image zoom on hover */
    .quality-banner:hover .quality-banner-image img {
        transform: scale(1.04);
    }


    /* ==============================
       IMAGE OVERLAY
       ============================== */

    .quality-banner-image::after {
        content: "";
        position: absolute;
        inset: 0;

        background: linear-gradient(
            90deg,
            rgba(0, 51, 102, 0.05),
            rgba(0, 51, 102, 0.35)
        );

        pointer-events: none;
    }


    /* ==============================
       CONTENT SECTION
       ============================== */

    .quality-banner-content {
        flex: 1;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: 45px 55px;

        background:
            linear-gradient(
                135deg,
                #ffffff 0%,
                #f7f9fc 100%
            );
    }


    /* ==============================
       WEEK LABEL
       ============================== */

    .quality-banner-week {
        display: inline-flex;
        align-items: center;

        width: fit-content;

        margin-bottom: 14px;

        padding: 7px 15px;

        background: #003366;
        color: #ffffff;

        border-radius: 50px;

        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
    }


    /* ==============================
       TITLE
       ============================== */

    .quality-banner-title {
        margin: 0;

        color: #003366;

        font-size: clamp(30px, 4vw, 48px);
        font-weight: 700;

        line-height: 1.15;

        letter-spacing: -0.5px;
    }


    /* ==============================
       GOLD ACCENT
       ============================== */

    .quality-banner-accent {
        width: 70px;
        height: 5px;

        margin: 20px 0;

        background: #D6A800;

        border-radius: 10px;
    }


    /* ==============================
       SUBTITLE
       ============================== */

    .quality-banner-subtitle {
        margin: 0;

        max-width: 650px;

        color: #4a5568;

        font-size: 17px;
        line-height: 1.6;
        font-weight: 400;
    }


    /* ==============================
       RESPONSIVE DESIGN
       ============================== */

    @media (max-width: 800px) {

        .quality-banner {
            flex-direction: column;

            margin: 20px auto;

            border-left: none;
            border-top: 6px solid #D6A800;
        }

        .quality-banner-image {
            flex: none;
            width: 100%;
            height: 230px;
        }

        .quality-banner-image img {
            min-height: 230px;
        }

        .quality-banner-content {
            padding: 35px 30px 40px;
        }

        .quality-banner-title {
            font-size: 34px;
        }
    }


    @media (max-width: 480px) {

        .quality-banner {
            border-radius: 12px;
        }

        .quality-banner-image {
            height: 190px;
        }

        .quality-banner-image img {
            min-height: 190px;
        }

        .quality-banner-content {
            padding: 28px 24px 32px;
        }

        .quality-banner-title {
            font-size: 30px;
        }

        .quality-banner-subtitle {
            font-size: 15px;
        }
    }
</style>


<!-- ==============================
     BANNER HTML
     ============================== -->

<div class="quality-banner" id="week1QualityBanner">

    <!-- IMAGE -->
    <div class="quality-banner-image">

        <!-- Replace the image filename below -->
        <img
            src="your-image.jpg"
            alt="Foundations of Project Quality"
        >

    </div>


    <!-- CONTENT -->
    <div class="quality-banner-content">

        <div class="quality-banner-week">
            Week 1
        </div>

        <h1 class="quality-banner-title">
            Foundations of<br>
            Project Quality
        </h1>

        <div class="quality-banner-accent"></div>

        <p class="quality-banner-subtitle">
            Explore the fundamental principles of project quality,
            including quality planning, assurance, and control.
        </p>

    </div>

</div>


<script>
    /* =========================================
       WEEK 1 BANNER — JAVASCRIPT
       Adds a subtle entrance animation
       ========================================= */

    document.addEventListener("DOMContentLoaded", function () {

        const banner = document.getElementById("week1QualityBanner");

        if (!banner) return;

        banner.style.opacity = "0";
        banner.style.transform = "translateY(15px)";
        banner.style.transition =
            "opacity 0.7s ease, transform 0.7s ease";

        setTimeout(function () {

            banner.style.opacity = "1";
            banner.style.transform = "translateY(0)";

        }, 100);

    });
</script>
