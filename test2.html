<style>
/* =========================================================
   WEEK 1 — FOUNDATIONS OF PROJECT QUALITY
   STANDALONE BANNER
   ========================================================= */

:root {
    --pq-navy: #003366;
    --pq-gold: #D6A800;
    --pq-gray: #5B6777;
    --pq-white: #FFFFFF;
}


/* =========================================================
   BANNER
   ========================================================= */

.pq-banner {
    width: 100%;
    max-width: 1400px;
    min-height: 350px;

    margin: 25px auto;

    display: flex;
    align-items: stretch;

    overflow: hidden;

    background: #FFFFFF;

    border-radius: 18px;

    border-left: 7px solid var(--pq-gold);

    box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.12);

    font-family: "Open Sans", Arial, sans-serif;

    opacity: 0;

    transform: translateY(20px);

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}


/* =========================================================
   IMAGE
   ========================================================= */

.pq-banner-image {
    flex: 0 0 45%;

    position: relative;

    overflow: hidden;

    background: var(--pq-navy);
}

.pq-banner-image img {
    width: 100%;
    height: 100%;

    min-height: 350px;

    display: block;

    object-fit: cover;
    object-position: center;

    transition: transform 0.7s ease;
}


/* Subtle image movement */

.pq-banner:hover .pq-banner-image img {
    transform: scale(1.035);
}


/* =========================================================
   IMAGE OVERLAY
   ========================================================= */

.pq-banner-image::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0, 51, 102, 0.02),
            rgba(0, 51, 102, 0.20)
        );

    pointer-events: none;
}


/* =========================================================
   CONTENT AREA
   ========================================================= */

.pq-banner-content {
    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 50px 60px;

    background:
        linear-gradient(
            135deg,
            #FFFFFF 0%,
            #F7F9FC 100%
        );
}


/* =========================================================
   WEEK LABEL
   ========================================================= */

.pq-banner-week {
    display: inline-flex;

    align-items: center;

    width: fit-content;

    margin-bottom: 18px;

    padding: 8px 18px;

    background: var(--pq-navy);

    color: #FFFFFF;

    border-radius: 50px;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* =========================================================
   TITLE
   ========================================================= */

.pq-banner-title {
    margin: 0;

    color: var(--pq-navy);

    font-size: clamp(34px, 4vw, 52px);

    font-weight: 700;

    line-height: 1.12;

    letter-spacing: -1px;
}


/* =========================================================
   GOLD ACCENT
   ========================================================= */

.pq-banner-accent {
    width: 75px;

    height: 5px;

    margin: 22px 0;

    background: var(--pq-gold);

    border-radius: 10px;
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.pq-banner-description {
    max-width: 650px;

    margin: 0;

    color: var(--pq-gray);

    font-size: 17px;

    line-height: 1.65;

    font-weight: 400;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .pq-banner {
        min-height: 300px;
    }

    .pq-banner-image {
        flex: 0 0 42%;
    }

    .pq-banner-image img {
        min-height: 300px;
    }

    .pq-banner-content {
        padding: 40px;
    }

    .pq-banner-title {
        font-size: 38px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 650px) {

    .pq-banner {

        flex-direction: column;

        margin: 20px auto;

        border-left: none;

        border-top:
            6px solid var(--pq-gold);

        border-radius: 14px;
    }


    .pq-banner-image {

        flex: none;

        width: 100%;

        height: 230px;
    }


    .pq-banner-image img {

        min-height: 230px;
    }


    .pq-banner-content {

        padding: 35px 25px 40px;
    }


    .pq-banner-week {

        font-size: 13px;

        padding: 7px 15px;
    }


    .pq-banner-title {

        font-size: 34px;

        letter-spacing: -0.5px;
    }


    .pq-banner-description {

        font-size: 15px;
    }
}
</style>


<!-- =========================================================
     STANDALONE WEEK 1 BANNER
     ========================================================= -->

<div class="pq-banner" id="projectQualityBanner">

    <!-- LEFT: PROJECT QUALITY IMAGE -->

    <div class="pq-banner-image">

        <img
            src="project-quality-week1.png"
            alt="Project Quality"
        >

    </div>


    <!-- RIGHT: WEEK INFORMATION -->

    <div class="pq-banner-content">

        <div class="pq-banner-week">
            Week 1
        </div>


        <h1 class="pq-banner-title">
            Foundations of<br>
            Project Quality
        </h1>


        <div class="pq-banner-accent"></div>


        <p class="pq-banner-description">
            Explore the fundamental principles of project quality,
            including quality planning, quality assurance, and
            quality control.
        </p>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const banner =
        document.getElementById("projectQualityBanner");

    if (!banner) return;

    setTimeout(function () {

        banner.style.opacity = "1";
        banner.style.transform = "translateY(0)";

    }, 100);

});
</script>
